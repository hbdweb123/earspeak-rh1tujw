<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="口语私教">
<title>随身口语私教 · 2.3</title>
<style>
  :root{
    --bg:#0d1017; --card:#161a24; --card2:#1e2433; --line:#2a3142;
    --text:#f0f2f8; --dim:#9ba5b8; --dim2:#687285;
    --accent:#ffd54a; --pink:#ff5470; --green:#4cd97b; --blue:#54a8ff; --purple:#b892ff; --orange:#ff9f43;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    max-width:600px;margin-inline:auto;
    padding:calc(12px + env(safe-area-inset-top)) 15px calc(44px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  /* 顶栏 */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:8px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffe066,#f5b700);color:#1d1600;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:0 3px 10px rgba(255,213,74,.2)}
  h1{font-size:17.5px;margin:0;letter-spacing:.2px;line-height:1.2}
  .sub{color:var(--dim2);font-size:11px;margin-top:2px;display:flex;align-items:center;gap:5px}
  .eng-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  .eng-dot.warn{background:var(--orange)}
  .topbtns{display:flex;gap:6px;flex:0 0 auto}
  .icobtn{
    position:relative;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:7px 10px;font-size:12px;cursor:pointer;white-space:nowrap;
    transition:.15s;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:4px;
  }
  .icobtn:active{background:#293145;transform:scale(.96)}
  .badge{
    position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
    background:var(--pink);color:#fff;border-radius:9px;font-size:10px;line-height:17px;
    text-align:center;font-weight:700;
  }
  .badge:empty{display:none}

  /* 模式切换 */
  .modes{display:flex;gap:6px;margin-bottom:10px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--line)}
  .mode{
    flex:1;padding:10px 6px;border-radius:10px;border:0;background:transparent;
    color:var(--dim);font-size:13.5px;font-weight:700;cursor:pointer;transition:.16s;font-family:inherit;
  }
  .mode.active{background:linear-gradient(180deg,#ffe066,#f5c400);color:#1f1800;box-shadow:0 2px 8px rgba(245,196,0,.22)}
  .mode.active.scene{background:linear-gradient(180deg,#70b8ff,#3b8eed);color:#001529;box-shadow:0 2px 8px rgba(59,142,237,.25)}

  /* 场景分类切换条 + 输入区 */
  .cat-bar{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .cat-bar::-webkit-scrollbar{display:none}
  .cat-pill{
    padding:5px 11px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
    background:var(--card);border:1px solid var(--line);color:var(--dim);transition:.15s;
  }
  .cat-pill.on{background:rgba(255,213,74,.14);border-color:rgba(255,213,74,.5);color:var(--accent)}
  .cat-pill.on.blue{background:rgba(84,168,255,.15);border-color:rgba(84,168,255,.5);color:var(--blue)}

  .inp-wrap{position:relative}
  textarea{
    width:100%;min-height:82px;resize:vertical;padding:12px 76px 12px 13px;
    background:var(--card);border:1.5px solid var(--line);border-radius:15px;
    color:var(--text);font-size:16px;line-height:1.55;font-family:inherit;
    outline:none;transition:border-color .18s;
  }
  textarea:focus{border-color:rgba(255,213,74,.65)}
  textarea::placeholder{color:var(--dim2);font-size:14.5px}
  .inp-tools{position:absolute;right:8px;bottom:10px;display:flex;gap:5px;align-items:center}
  .tool-ico{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card2);
    color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:inherit;transition:.15s;
  }
  .tool-ico:active{transform:scale(.92)}
  .tool-ico.rec{background:rgba(255,84,112,.22);border-color:var(--pink);color:var(--pink);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 11px}
  .chip{
    padding:6px 11px;border-radius:18px;font-size:12.3px;cursor:pointer;
    background:var(--card2);border:1px solid var(--line);color:var(--dim);transition:.15s;
  }
  .chip:active{background:#283044;color:var(--text);transform:scale(.97)}
  .chip.grp{border-color:rgba(84,168,255,.32);color:#92c7ff}

  /* 语音快捷控制条（常驻大按钮，淘汰难拖小滑杆） */
  .speed-bar{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:7px 10px;margin-bottom:11px;font-size:12px;color:var(--dim);
  }
  .spd-group{display:flex;gap:4px;flex:1;justify-content:flex-end}
  .spd-btn{
    padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);
    color:var(--dim);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s;
  }
  .spd-btn.on{background:rgba(255,213,74,.16);border-color:var(--accent);color:var(--accent)}
  .v-toggle{
    padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);
    color:var(--blue);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
  }

  .btn-main{
    width:100%;padding:14px;border-radius:14px;border:0;cursor:pointer;
    background:linear-gradient(180deg,#ffe066,#f5c400);color:#1f1800;
    font-size:16px;font-weight:800;letter-spacing:.4px;transition:transform .1s,filter .15s;font-family:inherit;
    box-shadow:0 4px 14px rgba(245,196,0,.18);
  }
  .btn-main.scene{background:linear-gradient(180deg,#70b8ff,#3b8eed);color:#001529;box-shadow:0 4px 14px rgba(59,142,237,.22)}
  .btn-main:active{transform:scale(.985);filter:brightness(.94)}
  .btn-main:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* 状态栏 */
  #status{margin-top:11px;font-size:13px;color:var(--dim);display:none;align-items:center;justify-content:space-between;gap:9px;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  #status.show{display:flex}
  #status.err{color:var(--pink);border-color:rgba(255,84,112,.4);background:rgba(255,84,112,.07)}
  #status.ok{color:var(--green);border-color:rgba(76,217,123,.35)}
  #status.now{color:var(--accent);border-color:rgba(255,213,74,.45);background:rgba(255,213,74,.07)}
  .st-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .st-stop{padding:4px 10px;border-radius:7px;background:rgba(255,84,112,.2);border:1px solid var(--pink);color:var(--pink);font-size:11.5px;font-weight:700;cursor:pointer;flex:0 0 auto}

  /* 结果卡片 */
  #result{margin-top:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .sec-title{
    font-size:11.5px;letter-spacing:.8px;color:var(--accent);font-weight:800;
    margin-bottom:10px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .sec-title.blue{color:var(--blue)}
  .sec-title.purple{color:var(--purple)}
  .sec-title.green{color:var(--green)}
  .sec-title.pink{color:var(--pink)}
  .sec-title .r{font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:0;text-transform:none}

  .en-line{font-size:21px;line-height:1.55;font-weight:700;letter-spacing:.2px}
  .w{cursor:pointer;border-radius:6px;padding:1px 3px;margin:0 -1px;transition:background .12s,color .12s;display:inline-block}
  .w.saved{border-bottom:1.5px dashed rgba(255,213,74,.65);color:#ffe999}
  .w:active,.w.on{background:rgba(255,213,74,.26);color:var(--accent)}
  .zh-line{color:var(--dim);font-size:13.5px;margin-top:8px}
  /* 点词拆解弹窗样式 */
  .wpop-word{font-size:24px;font-weight:900;color:var(--accent);letter-spacing:.3px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .wpop-ph{font-size:13px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-weight:500}
  .wpop-zh{font-size:16.5px;font-weight:700;color:var(--text);margin-top:8px}
  .wpop-why{font-size:13.5px;color:var(--dim);line-height:1.6;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .wpop-sec{font-size:11.5px;font-weight:800;color:var(--green);margin:12px 0 6px;letter-spacing:.5px}
  .wpop-coll{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
  .wpop-coll:active{background:var(--card2)}
  .wpop-ctx{margin-top:10px;padding:10px 12px;background:rgba(84,168,255,.08);border:1px solid rgba(84,168,255,.28);border-radius:11px;cursor:pointer}
  .wpop-ctx-en{font-size:13.8px;font-weight:700;color:#b8dbff;line-height:1.45}
  .wpop-ctx-zh{font-size:12px;color:var(--dim);margin-top:3px}
  .vitem-ctx{margin-top:6px;padding:7px 9px;background:rgba(84,168,255,.08);border-left:2px solid var(--blue);border-radius:6px;font-size:12px;color:#b8dbff;cursor:pointer;line-height:1.45}
  .vitem-coll{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
  .vitem-coll span{font-size:11.2px;padding:2px 7px;border-radius:6px;background:rgba(76,217,123,.12);color:var(--green);border:1px solid rgba(76,217,123,.28)}

  /* 播放控制按钮组 */
  .player{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .btn-pl{
    flex:1;min-width:calc(33% - 6px);padding:11px 6px;border-radius:11px;cursor:pointer;
    background:var(--card2);border:1px solid var(--line);color:var(--text);
    font-size:12.8px;font-weight:700;transition:.15s;font-family:inherit;text-align:center;
  }
  .btn-pl:active{background:#293145;transform:scale(.97)}
  .btn-pl.pri{background:rgba(255,213,74,.14);border-color:rgba(255,213,74,.48);color:var(--accent)}
  .btn-pl.playing{background:rgba(255,84,112,.22);border-color:var(--pink);color:#ff8da0;animation:pulse 1.2s infinite}

  /* 单句卡片 & 死磕循环按钮 */
  .dlg{padding:13px 0;border-bottom:1px solid rgba(42,49,66,.65)}
  .dlg:first-of-type{padding-top:2px}
  .dlg:last-of-type{border-bottom:0;padding-bottom:2px}
  .dlg-head{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
  .who{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:800;letter-spacing:.3px;flex:0 0 auto}
  .who.me{background:rgba(255,213,74,.16);color:var(--accent);border:1px solid rgba(255,213,74,.4)}
  .who.them{background:rgba(84,168,255,.16);color:var(--blue);border:1px solid rgba(84,168,255,.4)}
  .purpose{font-size:11.8px;color:var(--dim);font-weight:600;flex:1;min-width:0}
  .dlg-en{font-size:17.5px;font-weight:700;line-height:1.5;margin-bottom:4px;cursor:pointer}
  .dlg-zh{font-size:13px;color:var(--dim)}
  .dlg-tip{font-size:12px;color:var(--dim2);line-height:1.55;margin-top:6px;padding-left:9px;border-left:2px solid var(--accent)}
  .dlg-acts{display:flex;gap:6px;margin-top:9px;align-items:center}
  .act-mini{
    padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);font-size:11.8px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;
  }
  .act-mini.loop{border-color:rgba(255,213,74,.4);color:var(--accent);background:rgba(255,213,74,.09)}
  .act-mini.playing{background:rgba(255,84,112,.22);border-color:var(--pink);color:#ff8da0}

  /* 意群拆解 */
  .seg{padding:11px 0;border-bottom:1px solid rgba(42,49,66,.65)}
  .seg:first-of-type{padding-top:2px}
  .seg:last-of-type{border-bottom:0;padding-bottom:2px}
  .seg-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .seg-n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:rgba(84,168,255,.18);color:var(--blue);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .seg-en{font-size:16px;font-weight:700;flex:1;cursor:pointer}
  .seg-zh{font-size:12.8px;color:var(--dim);margin:0 0 5px 28px}
  .seg-pts{margin:0 0 0 28px;padding:0;list-style:none}
  .seg-pts li{font-size:12.3px;line-height:1.55;color:var(--dim2);position:relative;padding-left:12px;margin-bottom:3px}
  .seg-pts li:before{content:'•';position:absolute;left:0;color:var(--blue)}

  /* 单词与向外联想词汇卡 */
  .kp{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(42,49,66,.65);align-items:flex-start}
  .kp:last-child{border-bottom:0;padding-bottom:2px}
  .kp-main{flex:1;min-width:0;cursor:pointer}
  .kp-w{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tag-badge{font-size:10px;padding:1px 6px;border-radius:12px;font-weight:700}
  .tag-badge.new{background:rgba(255,84,112,.18);color:var(--pink);border:1px solid rgba(255,84,112,.4)}
  .tag-badge.assoc{background:rgba(76,217,123,.16);color:var(--green);border:1px solid rgba(76,217,123,.38)}
  .kp-ph{font-size:11.5px;color:var(--dim2);font-family:ui-monospace,Menlo,monospace;font-weight:400}
  .kp-zh{font-size:13px;color:var(--accent);font-weight:600;margin-top:2px}
  .kp-why{font-size:12.4px;line-height:1.55;color:var(--dim);margin-top:2px}
  .star{
    flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--dim2);font-size:16px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit;
  }
  .star:active{transform:scale(.9)}
  .star.on{background:rgba(255,213,74,.18);border-color:rgba(255,213,74,.55);color:var(--accent)}

  .btn-save-all{
    font-size:11.5px;padding:4px 9px;border-radius:8px;border:1px solid rgba(76,217,123,.4);
    background:rgba(76,217,123,.12);color:var(--green);font-weight:700;cursor:pointer;font-family:inherit;
  }

  .alt-row{font-size:14.5px;padding:10px 0;border-bottom:1px solid rgba(42,49,66,.65);display:flex;align-items:center;gap:9px}
  .alt-row:last-child{border-bottom:0}
  .tip-row{font-size:13px;line-height:1.6;color:var(--dim);padding:6px 0 6px 15px;position:relative}
  .tip-row:before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:11px;top:7px}

  /* 历史记录 */
  .hist-item{padding:10px 0;border-bottom:1px solid rgba(42,49,66,.6);cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .hist-item:last-child{border-bottom:0}
  .hi-tag{font-size:10.5px;padding:1px 6px;border-radius:6px;font-weight:700;flex:0 0 auto}
  .hi-tag.sc{background:rgba(84,168,255,.16);color:var(--blue)}
  .hi-tag.tr{background:rgba(255,213,74,.15);color:var(--accent)}
  .hi-zh{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hi-en{color:var(--dim2);font-size:12px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}

  /* 抽屉弹窗（生词本/句子本/闪卡自测/设置） */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
  .modal.show{display:flex}
  .sheet{
    width:100%;max-width:600px;max-height:86vh;background:var(--bg);
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    display:flex;flex-direction:column;animation:up .2s ease-out;
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 11px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sheet-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .sheet-close{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--dim);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .sheet-body{overflow-y:auto;padding:13px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .sheet-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
  .btn-s{flex:1;min-width:110px;padding:11px 8px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12.8px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center}
  .btn-s.pri{background:rgba(255,213,74,.16);border-color:rgba(255,213,74,.5);color:var(--accent)}

  /* 闪卡自测模式（遮住英文看中文） */
  .quiz-mask{
    filter:blur(6px);user-select:none;transition:filter .18s;
  }
  .vitem.reveal .quiz-mask{filter:none}
  .vitem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid rgba(42,49,66,.65);align-items:flex-start}
  .vitem:last-child{border-bottom:0}
  .vitem-main{flex:1;min-width:0;cursor:pointer}
  .vitem-w{font-size:15.5px;font-weight:700;color:var(--text)}
  .vitem-ph{font-size:11px;color:var(--dim2);font-family:ui-monospace,Menlo,monospace}
  .vitem-zh{font-size:13px;color:var(--accent);font-weight:600;margin-top:2px}
  .vitem-why{font-size:12.2px;color:var(--dim);line-height:1.5;margin-top:2px}
  .del{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--dim2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;color:var(--dim2);font-size:13.5px;padding:38px 16px;line-height:1.8}

  /* 设置表单 */
  .cfg-group{margin-bottom:14px}
  .cfg-label{font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:6px;display:block}
  .cfg-inp,.cfg-sel{
    width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:14px;font-family:inherit;outline:none;
  }
  .cfg-inp:focus,.cfg-sel:focus{border-color:var(--accent)}
  .cfg-note{font-size:11.5px;color:var(--dim2);line-height:1.55;margin-top:5px}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand">
    <div class="logo">Speak</div>
    <div>
      <h1>随身口语私教 <span style="font-size:11px;font-weight:700;color:var(--green);background:rgba(76,217,123,.14);padding:1px 6px;border-radius:6px;vertical-align:middle">v2.3</span></h1>
      <div class="sub" id="engStatus"><span class="eng-dot" id="engDot"></span><span id="engLabel">MiniMax 直连就绪</span></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js" async></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var K = {
    hist: 'earspeak_v2_hist',
    pref: 'earspeak_v2_pref',
    vocab: 'earspeak_vocab_v1',
    sents: 'earspeak_sents_v1',
    cfg: 'earspeak_v2_cfg'
  };

  /* ================= 1. 零操作扫码自动注入密钥（URL Hash 阅后即焚） ================= */
  var cfg = {
    provider: 'minimax',
    mmKey: '',
    mmModel: 'MiniMax-M3.1-Flash',
    gmKey: '',
    gmModel: 'gemini-4-hydrogen'
  };
  try {
    var savedCfg = JSON.parse(localStorage.getItem(K.cfg) || '{}');
    Object.keys(cfg).forEach(function (k) { if (savedCfg[k]) cfg[k] = savedCfg[k]; });
  } catch (e) {}

  // 支持通过 #setup=BASE64_JSON 或 #mmkey=xxx&gmkey=yyy 一键扫码写入手机本地并立刻清除地址栏尾巴
  (function checkHashSetup() {
    var h = location.hash || '';
    if (!h || h.length < 5) return;
    try {
      var raw = h.slice(1);
      var updated = false;
      if (raw.indexOf('setup=') === 0) {
        var b64 = decodeURIComponent(raw.slice(6));
        var obj = JSON.parse(atob(b64));
        if (obj.mmKey) { cfg.mmKey = obj.mmKey; updated = true; }
        if (obj.gmKey) { cfg.gmKey = obj.gmKey; updated = true; }
        if (obj.provider) { cfg.provider = obj.provider; updated = true; }
      } else {
        var params = new URLSearchParams(raw);
        if (params.get('mmkey')) { cfg.mmKey = params.get('mmkey'); updated = true; }
        if (params.get('gmkey')) { cfg.gmKey = params.get('gmkey'); updated = true; }
        if (params.get('provider')) { cfg.provider = params.get('provider'); updated = true; }
      }
      if (updated) {
        localStorage.setItem(K.cfg, JSON.stringify(cfg));
        history.replaceState(null, document.title, location.pathname + location.search);
        setTimeout(function () {
          setStatus('🎉 手机专属密钥已自动配好！国内免梯子随时可用', 'ok');
        }, 300);
      }
    } catch (e) {}
  })();

  var pref = { rate: 0.68, shadowGap: 3500, voiceGender: 'female', cat: 'social', mode: 'scene' };
  try {
    var sp = JSON.parse(localStorage.getItem(K.pref) || '{}');
    Object.keys(pref).forEach(function (k) { if (sp[k] != null) pref[k] = sp[k]; });
  } catch (e) {}

  var mode = pref.mode === 'translate' ? 'translate' : 'scene';
  var busy = false;
  var current = null;
  var vocabQuizMode = false;
  var sentQuizMode = false;

  /* ================= 2. 三大高频场景预设库（搭讪社交 / 物流商务 / 旅行生活） ================= */
  var PRESETS = {
    social: {
      translate: [
        '刚才在街上看到你，觉得你很有气质，想过来认识一下',
        '你今天穿的这身搭配特别好看，能加个 Instagram 或微信吗？',
        '我刚来这边不久，附近有什么好喝的咖啡店推荐吗？',
        '如果周末你有空的话，咱们可以一起喝杯咖啡聊聊天'
      ],
      scene: [
        '在马路上看见一个女生很漂亮，想自然大方上去搭讪认识她、要个联系方式',
        '在咖啡馆/酒吧看到心仪的女生，想破冰开启聊天，不显得油腻唐突',
        '和刚认识的外国女生第一次约喝咖啡，怎么夸她并聊些轻松的话题',
        '去当地按摩店/SPA馆，上门咨询有哪些按摩项目、时长、价格和力度要求'
      ]
    },
    biz: {
      translate: [
        '这批货为什么比原定计划晚了整整一周？今天必须给我准确到港时间',
        '海关清关到底卡在哪个环节了？需要我们补充什么单据？',
        '如果下周三之前还不能进仓，这笔订单的延误损失需要你们承担',
        '咱们合作这么久了，这次付款账期能不能再放宽15天？'
      ],
      scene: [
        '物流供应商把我的货延误了，我要去追问真实原因、逼他给出确切到货时间（ETA）',
        '货到目的港了，客户突然以市场不好为由要求降价 15%，我要稳住他但守住底线',
        '供应商要求必须 100% 先款后货，我想谈成 30% 定金 + 见提单付尾款',
        '仓库验货发现有一批外包装破损、次品率超标，找工厂交涉返工或扣款'
      ]
    },
    travel: {
      translate: [
        '不好意思，我预订了今晚的大床房，请问可以帮我升级个安静的高楼层吗？',
        '这道菜不要放香菜，另外帮我拿一份冰水和买单，谢谢',
        '我的行李箱在托运时轮子摔坏了，请问去哪里办理索赔手续？',
        '去市中心打车大概多少钱？怎么走不会堵车？'
      ],
      scene: [
        '在国外餐厅点单，想让服务员推荐招牌菜、询问忌口，最后结账',
        '在机场发现托运行李延误还没到，找航司柜台交涉登记并要求送到酒店',
        '租车或包车跟当地司机谈价格、确认路线和等待时间',
        '身体有点不舒服（比如肩膀疼或感冒），去当地药店让药剂师推荐非处方药'
      ]
    }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function asArr(v) {
    if (v == null) return [];
    if (Array.isArray(v)) return v;
    if (typeof v === 'string') return v.trim() ? [v.trim()] : [];
    if (typeof v === 'object') return [v];
    return [];
  }
  function asStr(v, dflt) {
    if (v == null) return dflt || '';
    if (typeof v === 'string') return v.trim();
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    if (Array.isArray(v)) return v.map(function (x) { return asStr(x); }).filter(Boolean).join('；');
    if (typeof v === 'object') return asStr(v.text || v.en || v.zh || v.p || v.tip || v.point || v.why || '');
    return dflt || '';
  }
  function readJSON(k, dflt) {
    try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(dflt)); } catch (e) { return dflt; }
  }
  function writeJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }

  function updateEngineBadge() {
    var dot = $('engDot'), lbl = $('engLabel');
    if (cfg.provider === 'minimax') {
      if (cfg.mmKey) {
        dot.className = 'eng-dot';
        lbl.textContent = 'MiniMax 免梯直连 · 极速';
      } else {
        dot.className = 'eng-dot warn';
        lbl.textContent = '点右上角 ⚙️ 填入或扫码激活密钥';
      }
    } else if (cfg.provider === 'gemini') {
      dot.className = cfg.gmKey ? 'eng-dot' : 'eng-dot warn';
      lbl.textContent = cfg.gmKey ? 'Gemini 通道（需开 VPN）' : 'Gemini 未填 Key';
    } else {
      dot.className = 'eng-dot';
      lbl.textContent = 'WorkBuddy 积分通道';
    }
  }

  function setStatus(msg, kind, showStop) {
    var el = $('status'), left = $('stLeft'), stp = $('stStop');
    if (!msg) { el.className = ''; left.innerHTML = ''; stp.style.display = 'none'; return; }
    el.className = 'show ' + (kind || '');
    left.innerHTML = (kind === 'busy' ? '<div class="spin"></div>' : '') + '<div>' + esc(msg) + '</div>';
    stp.style.display = showStop ? '' : 'none';
  }

  /* ================= 3. 语音合成与「三阶慢速死磕循环」引擎 ================= */
  var voices = { female: null, male: null, zh: null };
  function pickVoices() {
    if (!('speechSynthesis' in window)) return;
    var list = window.speechSynthesis.getVoices() || [];
    if (!list.length) return;
    var en = list.filter(function (v) { return /^en/i.test(v.lang); });
    voices.female = en.filter(function (v) { return /Samantha|Ava|Allison|Google US English|Victoria|Karen/i.test(v.name); })[0]
      || en.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] || en[0] || null;
    voices.male = en.filter(function (v) { return /Daniel|Alex|Tom|Aaron|Arthur|Fred|Google UK English Male/i.test(v.name); })[0]
      || en[1] || voices.female;
    var zh = list.filter(function (v) { return /^zh/i.test(v.lang); });
    voices.zh = zh.filter(function (v) { return /Ting-Ting|Meijia|zh[-_]CN/i.test(v.name + ' ' + v.lang); })[0] || zh[0] || null;
  }
  if ('speechSynthesis' in window) { pickVoices(); window.speechSynthesis.onvoiceschanged = pickVoices; }

  var speakSeq = 0;
  function stopSpeak() {
    speakSeq++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.playing').forEach(function (b) { b.classList.remove('playing'); });
    setStatus('');
  }
  $('stStop').addEventListener('click', stopSpeak);

  function currentEnVoice() {
    return pref.voiceGender === 'male' ? (voices.male || voices.female) : (voices.female || voices.male);
  }

  function speakSteps(steps, onDone, loopForever) {
    if (!('speechSynthesis' in window)) { setStatus('当前浏览器不支持语音朗读', 'err'); return; }
    var mySeq = ++speakSeq, i = 0;
    function finish() { if (mySeq === speakSeq && onDone) onDone(); }
    function next() {
      if (mySeq !== speakSeq) return;
      if (i >= steps.length) {
        if (loopForever) { i = 0; } else { return finish(); }
      }
      var st = steps[i++];
      if (st.status) setStatus(st.status, 'now', true);
      var u = new SpeechSynthesisUtterance(st.text);
      u.rate = st.rate || pref.rate;
      u.lang = st.lang || 'en-US';
      var v = st.lang === 'zh-CN' ? voices.zh : currentEnVoice();
      if (v) u.voice = v;
      u.onend = function () {
        if (mySeq !== speakSeq) return;
        if (st.gapAfter > 0) setTimeout(next, st.gapAfter); else next();
      };
      u.onerror = function () { if (mySeq === speakSeq) setTimeout(next, 120); };
      try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) { finish(); }
    }
    next();
  }

  function speakOne(text, customRate) {
    stopSpeak();
    speakSteps([{ text: text, rate: customRate || pref.rate, gapAfter: 0 }]);
  }

  // 把句子拆成 2~3 个词一组的小意群，实现“词间有停顿的慢速拆读”
  function splitIntoChunks(sentence) {
    var byPunct = String(sentence || '').split(/([,.;!?]+)/).reduce(function (acc, cur) {
      if (/^[,.;!?]+$/.test(cur) && acc.length) acc[acc.length - 1] += cur;
      else if (cur.trim()) acc.push(cur.trim());
      return acc;
    }, []);
    var chunks = [];
    byPunct.forEach(function (clause) {
      var words = clause.split(/\s+/);
      if (words.length <= 4) {
        chunks.push(clause);
      } else {
        for (var i = 0; i < words.length; i += 3) {
          chunks.push(words.slice(i, i + 3).join(' '));
        }
      }
    });
    return chunks.length ? chunks : [sentence];
  }

  // 核心功能：单句三阶死磕循环（① 慢速分块拆读 → ② 留白跟读 → ③ 自然语速带读，无限循环直到学会）
  function startSentenceLoop(enText, zhText, btnEl) {
    var wasPlaying = btnEl && btnEl.classList.contains('playing');
    stopSpeak();
    if (wasPlaying) return;
    if (btnEl) btnEl.classList.add('playing');

    var chunks = splitIntoChunks(enText);
    var steps = [];
    if (zhText) {
      steps.push({ text: zhText, lang: 'zh-CN', rate: 1.05, gapAfter: 500, status: '🔁 死磕循环｜先听中文意思…' });
    }
    chunks.forEach(function (c, idx) {
      steps.push({
        text: c,
        rate: Math.max(0.48, pref.rate - 0.08),
        gapAfter: 650,
        status: '🐢 第1步·慢速拆读 (' + (idx + 1) + '/' + chunks.length + ')：' + c
      });
    });
    steps.push({
      text: enText,
      rate: pref.rate,
      gapAfter: pref.shadowGap,
      status: '🗣️ 第2步·慢速整句 → 留白 ' + (pref.shadowGap / 1000).toFixed(1) + ' 秒，请开口跟读！'
    });
    steps.push({
      text: enText,
      rate: Math.min(0.95, pref.rate + 0.18),
      gapAfter: 1400,
      status: '⚡ 第3步·常速巩固（循环中，练熟随时点停止）'
    });

    speakSteps(steps, function () {

  /* ================= 6. 三通道大模型调用（MiniMax 流式防断连 + Gemini + WorkBuddy） ================= */
  async function callMiniMax(sys, usr) {
    if (!cfg.mmKey) throw new Error('尚未配置 MiniMax 密钥，请重新扫一次电脑上的激活二维码，或点右上角 ⚙️ 填入');
    var resp;
    try {
      resp = await fetch('https://api.minimaxi.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + cfg.mmKey.trim(),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: cfg.mmModel || 'MiniMax-M3.1-Flash',
          stream: true,
          reasoning_effort: 'low',
          messages: [
            { role: 'system', content: sys + '\n【最高优先级指令】请跳过冗长推理思考，第一时间直接输出简洁的 JSON 结果！' },
            { role: 'user', content: usr }
          ],
          temperature: mode === 'scene' ? 0.45 : 0.3,
          max_tokens: 16384
        })
      });
    } catch (netErr) {
      throw new Error('网络连接中断 (' + (netErr.message || 'Load failed') + ')。若手机正挂着不稳定 VPN，建议关掉 VPN 直接用国内网络秒连 MiniMax，或点再试一次');
    }
    if (!resp.ok) {
      var errTxt = await resp.text();
      throw new Error('MiniMax 接口返回 HTTP ' + resp.status + '：' + errTxt.slice(0, 120));
    }
    if (!resp.body || !resp.body.getReader) {
      var data = await resp.json();
      var msg = data.choices && data.choices[0] && data.choices[0].message;
      return (msg && msg.content) || '';
    }
    var reader = resp.body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buf = '';
    var content = '';
    var thinkTicks = 0;
    while (true) {
      var res = await reader.read();
      if (res.done) break;
      buf += decoder.decode(res.value, { stream: true });
      var lines = buf.split('\n');
      buf = lines.pop() || '';
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.indexOf('data:') !== 0) continue;
        var payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          var evt = JSON.parse(payload);
          var delta = evt.choices && evt.choices[0] && evt.choices[0].delta;
          if (delta) {
            if (delta.content) {
              content += delta.content;
            }
            if (delta.reasoning_content || (content.indexOf('<think>') >= 0 && content.indexOf('</think>') < 0)) {
              thinkTicks++;
              if (thinkTicks % 5 === 1) {
                setStatus('🧠 私教正在针对你的场景定制地道短句…', 'busy');
              }
            } else if (content.length > 10) {
              setStatus('✍️ 正在生成短句与关联重点词 (' + Math.min(99, Math.round(content.length / 8)) + '%)…', 'busy');
            }
          }
        } catch (e) {}
      }
    }
    if (!content) throw new Error('MiniMax 返回内容为空，请再点一次');
    return content;
  }

  async function callGemini(sys, usr) {

  function parseJSON(raw) {
    var s = String(raw || '').replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/<think>[\s\S]*/gi, '').trim();
    var m = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (m) s = m[1].trim();
    var a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a >= 0 && b > a) s = s.slice(a, b + 1);
    try {
      return JSON.parse(s);
    } catch (e1) {
      // 容错修复：去除末尾多余逗号、替换未转义控制字符
      var cleaned = s.replace(/,\s*([}\]])/g, '$1').replace(/[\u0000-\u0019]+/g, ' ');
      return JSON.parse(cleaned);
    }
  }

  function normWordList(list) {
    return asArr(list).map(function (x) {
      if (typeof x === 'string') return { p: x.trim(), zh: '', phonetic: '', why: '', isNew: true };
      if (!x || typeof x !== 'object') return null;
      var p = asStr(x.p || x.word || x.phrase || x.en || x.term);
      if (!p) return null;
      return {
        p: p,
        zh: asStr(x.zh || x.cn || x.meaning || x.translation),
        phonetic: asStr(x.phonetic || x.ipa || x.pronunciation),
        why: asStr(x.why || x.tip || x.usage || x.note || x.example),
        isNew: x.isNew !== false
      };
    }).filter(Boolean);
  }

  function normalizeResult(rawObj, wantedMode, rawInput) {
    var d = (rawObj && typeof rawObj === 'object') ? rawObj : {};
    d.rawInput = asStr(d.rawInput || rawInput);
    d.zh = asStr(d.zh || d.cn || d.rawInput);
    d.en = asStr(d.en || d.sentence || d.translation);
    d.scene = asStr(d.scene || d.title || d.rawInput);
    d.situation = asStr(d.situation || d.strategy || d.summary);

    d.segments = asArr(d.segments || d.chunks).map(function (s) {
      if (typeof s === 'string') return { en: s.trim(), zh: '', points: [] };
      if (!s || typeof s !== 'object') return null;
      var en = asStr(s.en || s.phrase || s.chunk || s.text);
      if (!en) return null;
      return {
        en: en,
        zh: asStr(s.zh || s.cn || s.meaning),
        points: asArr(s.points || s.point || s.tips || s.tip || s.notes || s.why).map(function (pt) {
          return asStr(pt);
        }).filter(Boolean)
      };
    }).filter(Boolean);

    d.phrases = normWordList(d.phrases || d.keywords || d.words);
    d.relatedWords = normWordList(d.relatedWords || d.related_words || d.related || d.associations);

    d.alts = asArr(d.alts || d.alternatives).map(function (a) {
      if (typeof a === 'string') return { en: a.trim(), zh: '' };
      if (!a || typeof a !== 'object') return null;
      var en = asStr(a.en || a.text || a.sentence);
      if (!en) return null;
      return {
        en: en,
        zh: asStr(a.zh || a.cn || a.note || a.scene || a.tone)
      };
    }).filter(Boolean);

    d.dialogues = asArr(d.dialogues || d.dialogue || d.sentences || d.lines).map(function (x, idx) {
      if (typeof x === 'string') return { who: idx < 4 ? 'me' : 'them', purpose: '', en: x.trim(), zh: '', tip: '' };
      if (!x || typeof x !== 'object') return null;
      var en = asStr(x.en || x.text || x.sentence);
      if (!en) return null;
      var whoRaw = asStr(x.who || x.speaker || x.role).toLowerCase();
      var isThem = /them|other|partner|her|she|supplier|对方|女/.test(whoRaw);
      return {
        who: isThem ? 'them' : 'me',
        purpose: asStr(x.purpose || x.intent || x.step || x.label),
        en: en,
        zh: asStr(x.zh || x.cn || x.meaning || x.translation),
        tip: asStr(x.tip || x.tips || x.note || x.why)
      };
    }).filter(Boolean);

    d.tips = asArr(d.tips || d.tip || d.notes || d.advice).map(function (t) {
      return asStr(t);
    }).filter(Boolean);

    // 智能交叉兜底：如果用户选了场景模式但模型只回了 en，或选了查句模式但模型回了 dialogues，自动互相补全，绝不报错
    if (!d.en && d.segments.length) {
      d.en = d.segments.map(function (s) { return s.en; }).join(' ');
    }
    if (!d.en && d.dialogues.length) {
      d.en = d.dialogues[0].en;
    }
    if (!d.dialogues.length && d.en) {
      d.dialogues.push({ who: 'me', purpose: '① 核心说法', en: d.en, zh: d.zh, tip: '' });
      d.alts.forEach(function (a, i) {
        d.dialogues.push({ who: 'me', purpose: '替换说法 ' + (i + 1), en: a.en, zh: a.zh, tip: '' });
      });
    }
    d.mode = (wantedMode === 'scene' || (!wantedMode && d.mode === 'scene')) ? 'scene' : 'translate';
    return d;
  }

  /* ================= 7. 页面渲染（单词点读 + 点词拆解弹窗 + 联想词积累 + 单句死磕循环） ================= */
  var SYS_WORD =
    '你是一位英语口语私教。学生在句子里点了一个陌生英文词，请你结合原句语境，用最简洁接地气的大白话帮他拆解这个词，方便他立刻记住并收进单词库。\n' +
    '严格只输出合法 JSON：{"p":"原词","phonetic":"/美式IPA音标/","zh":"在这句话里的精准中文意思(简短)","why":"一句话讲清怎么用、有什么记忆窍门","colls":[{"en":"最常用高频短搭配1","zh":"中文意思"},{"en":"最常用高频短搭配2","zh":"中文意思"}]}';

  var wordLookupCache = {};
  var activeWordItem = null;

  function renderWordPopupContent(item, loading) {
    activeWordItem = item;
    var saved = inVocab(item.p);
    var saveBtn = $('wPopSave');
    if (saveBtn) {
      saveBtn.textContent = saved ? '★ 已收入单词库（点此移出）' : '⭐ 收入我的单词库';
      saveBtn.className = saved ? 'btn-s' : 'btn-s pri';
    }
    var colls = asArr(item.colls);
    var collsHTML = colls.length
      ? '<div class="wpop-sec">🔥 最常连着用的高频搭配（点一下听发音）</div>' +
        colls.map(function (c) {
          var en = typeof c === 'string' ? c : asStr(c && c.en);
          var zh = typeof c === 'string' ? '' : asStr(c && c.zh);
          return en ? '<div class="wpop-coll" data-say="' + esc(en) + '"><div><div style="font-weight:700;font-size:14.5px">' + esc(en) + '</div>' +
            (zh ? '<div style="font-size:12px;color:var(--dim);margin-top:2px">' + esc(zh) + '</div>' : '') + '</div><span>🔊</span></div>' : '';
        }).join('')
      : '';
    var ctxHTML = item.ctxEn
      ? '<div class="wpop-sec" style="color:var(--blue)">📌 绑定原句记忆（入库时自动保存）</div>' +
        '<div class="wpop-ctx" data-say="' + esc(item.ctxEn) + '">' +
          '<div class="wpop-ctx-en">🔊 ' + esc(item.ctxEn) + '</div>' +
          (item.ctxZh ? '<div class="wpop-ctx-zh">' + esc(item.ctxZh) + '</div>' : '') +
        '</div>'
      : '';

    $('wPopBody').innerHTML =
      '<div class="wpop-word">' + esc(item.p) + (item.phonetic ? '<span class="wpop-ph">' + esc(item.phonetic) + '</span>' : '') + '</div>' +
      (loading
        ? '<div style="display:flex;align-items:center;gap:9px;margin:14px 0;color:var(--dim);font-size:13.5px"><div class="spin"></div>正在结合原句拆解意思与高频搭配…</div>'
        : '<div class="wpop-zh">' + esc(item.zh || '点击下方按钮收进单词库') + '</div>' +
          (item.why ? '<div class="wpop-why">💡 ' + esc(item.why) + '</div>' : '') +
          collsHTML
      ) + ctxHTML;

    $('wPopBody').querySelectorAll('[data-say]').forEach(function (el) {
      el.addEventListener('click', function () { speakOne(el.dataset.say, pref.rate); });
    });
  }

  function findLocalWordInfo(word) {
    var key = asStr(word).toLowerCase();
    if (!key) return null;
    if (wordLookupCache[key]) return wordLookupCache[key];
    var vMatch = vocabAll().find(function (x) { return asStr(x.p).toLowerCase() === key; });
    if (vMatch) return vMatch;
    if (current) {
      var pool = asArr(current.phrases).concat(asArr(current.relatedWords));
      var cMatch = pool.find(function (x) {
        var xp = asStr(x.p).toLowerCase();
        return xp === key || xp.split(/\s+/).indexOf(key) >= 0;
      });
      if (cMatch && cMatch.zh && asStr(cMatch.p).toLowerCase() === key) return cMatch;
    }
    return null;
  }

  function openWordPopup(word, ctxEn, ctxZh) {
    var cleanW = asStr(word).replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, '');
    if (!cleanW) return;
    // 立刻慢速读一遍这个单词，零延迟反馈
    speakOne(cleanW, Math.max(0.48, pref.rate - 0.1));
    $('mWord').classList.add('show');

    var local = findLocalWordInfo(cleanW);
    if (local && local.zh && asArr(local.colls).length) {
      renderWordPopupContent({
        p: local.p || cleanW,
        phonetic: local.phonetic || '',
        zh: local.zh,
        why: local.why || '',
        colls: local.colls,
        ctxEn: ctxEn || local.ctxEn || '',
        ctxZh: ctxZh || local.ctxZh || ''
      }, false);
      return;
    }

    // 先展示已有释义或加载态，同时后台 1~2 秒调 AI 补齐精准释义与高频搭配
    renderWordPopupContent({
      p: cleanW,
      phonetic: (local && local.phonetic) || '',
      zh: (local && local.zh) || '',
      why: (local && local.why) || '',
      colls: [],
      ctxEn: ctxEn || '',
      ctxZh: ctxZh || ''
    }, !(local && local.zh));

    var usrPrompt = '陌生单词：' + cleanW + (ctxEn ? '\n所在原句：' + ctxEn : '') + (ctxZh ? '\n原句中文：' + ctxZh : '');
    callLLM(SYS_WORD, usrPrompt)
      .then(function (raw) {
        var obj = parseJSON(raw);
        var fullItem = {
          p: cleanW,
          phonetic: asStr(obj.phonetic || (local && local.phonetic)),
          zh: asStr(obj.zh || (local && local.zh)),
          why: asStr(obj.why || (local && local.why)),
          colls: asArr(obj.colls || obj.collocations).map(function (c) {
            return typeof c === 'string' ? { en: c, zh: '' } : { en: asStr(c && (c.en || c.p)), zh: asStr(c && c.zh) };
          }).filter(function (c) { return c.en; }),
          ctxEn: ctxEn || '',
          ctxZh: ctxZh || ''
        };
        wordLookupCache[cleanW.toLowerCase()] = fullItem;
        if (activeWordItem && activeWordItem.p.toLowerCase() === cleanW.toLowerCase()) {
          renderWordPopupContent(fullItem, false);
        }
      })
      .catch(function (err) {
        if (activeWordItem && activeWordItem.p.toLowerCase() === cleanW.toLowerCase()) {
          renderWordPopupContent({
            p: cleanW,
            phonetic: (local && local.phonetic) || '',
            zh: (local && local.zh) || '暂时无法联网解析（可先慢听发音或收入单词库）',
            why: (local && local.why) || ((err && err.message) ? err.message : ''),
            colls: [],
            ctxEn: ctxEn || '',
            ctxZh: ctxZh || ''
          }, false);
        }
      });
  }

  function wordsToHTML(en) {
    return (asStr(en).match(/[A-Za-z']+[.,!?;:]*|\s+|[^A-Za-z'\s]+/g) || []).map(function (t) {
      var core = t.replace(/[^A-Za-z']/g, '');
      if (!core) return esc(t);
      var isSaved = inVocab(core);
      return '<span class="w' + (isSaved ? ' saved' : '') + '" data-w="' + esc(core) + '">' + esc(t) + '</span>';
    }).join('');
  }

  function wordCardHTML(title, subtitle, list, isAssoc) {
    var safeList = normWordList(list);
    if (!safeList.length) return '';
    var vAll = vocabAll();
    var rows = safeList.map(function (x) {
      var saved = vAll.some(function (v) { return asStr(v.p).toLowerCase() === asStr(x.p).toLowerCase(); });
      return '<div class="kp">' +
        '<div class="kp-main" data-say="' + esc(x.p) + '">' +
          '<div class="kp-w">' + esc(x.p) +
            (x.phonetic ? '<span class="kp-ph">' + esc(x.phonetic) + '</span>' : '') +
            (isAssoc ? '<span class="tag-badge assoc">联想积累</span>' : (x.isNew ? '<span class="tag-badge new">重点</span>' : '')) +
          '</div>' +
          (x.zh ? '<div class="kp-zh">' + esc(x.zh) + '</div>' : '') +
          (x.why ? '<div class="kp-why">' + esc(x.why) + '</div>' : '') +
        '</div>' +
        '<button class="star' + (saved ? ' on' : '') + '" data-vocab="' + esc(x.p) + '" ' +
          'data-zh="' + esc(x.zh || '') + '" data-ph="' + esc(x.phonetic || '') + '" data-why="' + esc(x.why || '') + '">' +
          (saved ? '★' : '☆') + '</button>' +
      '</div>';
    }).join('');
    var saveAllBtn = '<button class="btn-save-all" data-save-batch="' + (isAssoc ? 'assoc' : 'phrase') + '">+ 一键全收进生词本</button>';
    return '<div class="card" style="' + (isAssoc ? 'border-color:rgba(76,217,123,.35)' : '') + '">' +
      '<div class="sec-title ' + (isAssoc ? 'green' : 'purple') + '">' +
        '<span>' + title + ' <span class="r">' + subtitle + '</span></span>' + saveAllBtn +
      '</div>' + rows + '</div>';
  }

  function bindCommon(d) {
    var R = $('result');
    R.querySelectorAll('.w').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        R.querySelectorAll('.w.on').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
        var ctxBox = el.closest('[data-ctx-en]');
        var ctxEn = ctxBox ? ctxBox.dataset.ctxEn : (d && d.en ? d.en : '');
        var ctxZh = ctxBox ? ctxBox.dataset.ctxZh : (d && d.zh ? d.zh : '');
        openWordPopup(el.dataset.w, ctxEn, ctxZh);
      });
    });
    R.querySelectorAll('.kp-main').forEach(function (el) {
      el.addEventListener('click', function () { speakOne(el.dataset.say, pref.rate); });
    });
    R.querySelectorAll('[data-vocab]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var added = toggleVocab({
          p: btn.dataset.vocab,
          zh: btn.dataset.zh,
          phonetic: btn.dataset.ph,
          why: btn.dataset.why
        });
        btn.classList.toggle('on', added);
        btn.textContent = added ? '★' : '☆';
        setStatus(added ? '📒 已收进生词本：' + btn.dataset.vocab : '已从生词本移除', added ? 'ok' : '');
      });
    });
    R.querySelectorAll('[data-save-batch]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var arr = btn.dataset.saveBatch === 'assoc' ? (d.relatedWords || []) : (d.phrases || []);
        var count = 0;
        arr.forEach(function (item) {
          if (!inVocab(item.p)) { toggleVocab(item); count++; }
        });
        render(d);
        setStatus('📒 已批量收入 ' + count + ' 个重点词到生词本！', 'ok');
      });
    });
    R.querySelectorAll('[data-star]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var added = toggleSent({ en: btn.dataset.star, zh: btn.dataset.zh || '' });
        btn.classList.toggle('on', added);
        btn.textContent = added ? '★' : '☆';
        setStatus(added ? '⭐ 已收进句子本' : '已从句子本移出', added ? 'ok' : '');
      });
    });
    R.querySelectorAll('[data-loop-en]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        startSentenceLoop(btn.dataset.loopEn, btn.dataset.loopZh || '', btn);
      });
    });
    R.querySelectorAll('[data-slow-en]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var chunks = splitIntoChunks(btn.dataset.slowEn);
        stopSpeak();
        btn.classList.add('playing');
        setStatus('🐢 分词慢速带读中…', 'now', true);
        speakSteps(chunks.map(function (c) {
          return { text: c, rate: Math.max(0.48, pref.rate - 0.08), gapAfter: 650 };
        }), function () {
          btn.classList.remove('playing');
          setStatus('');
        });
      });
    });
  }

    $('result').innerHTML =

        (d.zh ? '<div class="zh-line">' + esc(d.zh) + '</div>' : '') +

          '<button class="btn-pl pri" data-loop-en="' + esc(d.en) + '" data-loop-zh="' + esc(d.zh || '') + '" style="flex:1.5">🔁 死磕这句 (慢拆→跟读→循环)</button>' +
          '<button class="btn-pl" data-slow-en="' + esc(d.en) + '">🐢 拆词慢读</button>' +
          '<button class="btn-pl" id="btnWhole">▶ 整句读</button>' +
          '<button class="star' + (savedMain ? ' on' : '') + '" data-star="' + esc(d.en) + '" data-zh="' + esc(d.zh || '') + '" style="width:42px;height:auto">' + (savedMain ? '★' : '☆') + '</button>' +
        '</div>' +
      '</div>' +
      wordCardHTML('🧠 顺带记这几个关联重点词', '向外联想积累 · 点词发音', d.relatedWords, true) +
      wordCardHTML('📌 本句核心词拆解', '点词听音 · ☆ 存生词本', d.phrases, false) +
      (segHTML ? '<div class="card"><div class="sec-title blue">✂️ 按呼吸意群慢读拆解 <span class="r">点意群单独跟读</span></div>' + segHTML + '</div>' : '') +
      (altHTML ? '<div class="card"><div class="sec-title">🔄 同一意思还能这么说 <span class="r">不同语气替换</span></div>' + altHTML + '</div>' : '');

    bindCommon(d);
    var R = $('result');
    R.querySelectorAll('[data-say]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.classList.contains('w')) return;
        speakOne(el.dataset.say, pref.rate);
      });
    });
    var bw = $('btnWhole');
    if (bw) bw.addEventListener('click', function () { speakOne(d.en, pref.rate); });
  }

  function renderScene(d) {
    d = normalizeResult(d, 'scene', d && d.rawInput);
    var dlgHTML = asArr(d.dialogues).map(function (x) {
      var isMe = x.who === 'me';
      var saved = inSents(x.en);
      return '<div class="dlg">' +
        '<div class="dlg-head">' +
          '<span class="who ' + (isMe ? 'me' : 'them') + '">' + (isMe ? '🙋‍♂️ 我方必杀句' : '💬 对方可能回') + '</span>' +
          '<span class="purpose">' + esc(x.purpose || '') + '</span>' +
          '<button class="star' + (saved ? ' on' : '') + '" style="width:30px;height:30px;font-size:14px" ' +
            'data-star="' + esc(x.en) + '" data-zh="' + esc(x.zh || '') + '">' + (saved ? '★' : '☆') + '</button>' +
        '</div>' +
        '<div class="dlg-en" data-say="' + esc(x.en) + '" data-ctx-en="' + esc(x.en) + '" data-ctx-zh="' + esc(x.zh || '') + '">' + wordsToHTML(x.en) + '</div>' +
        (x.zh ? '<div class="dlg-zh">' + esc(x.zh) + '</div>' : '') +
        (x.tip ? '<div class="dlg-tip">💡 ' + esc(x.tip) + '</div>' : '') +
        '<div class="dlg-acts">' +
          '<button class="act-mini loop" data-loop-en="' + esc(x.en) + '" data-loop-zh="' + esc(x.zh || '') + '">🔁 死磕这句 (循环慢跟读)</button>' +
          '<button class="act-mini" data-slow-en="' + esc(x.en) + '">🐢 拆词慢读</button>' +

    var tipsHTML = asArr(d.tips).map(function (t) { return '<div class="tip-row">' + esc(asStr(t)) + '</div>'; }).join('');
    var meList = asArr(d.dialogues).filter(function (x) { return x.who === 'me'; });
    var allList = asArr(d.dialogues);

    $('result').innerHTML =
      '<div class="card" style="border-color:rgba(84,168,255,.4)">' +
        '<div class="sec-title blue">🎬 场景救场锦囊 <span class="r">超短句实战 · 每句都能单独死磕</span></div>' +

      (tipsHTML ? '<div class="card"><div class="sec-title pink">⚡ 现场发挥要点</div>' + tipsHTML + '</div>' : '');

    bindCommon(d);
    var R = $('result');
    R.querySelectorAll('[data-say]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.classList.contains('w')) return;
        speakOne(el.dataset.say, pref.rate);
      });
    });

    var bMe = $('btnMeShadow');
    if (bMe) bMe.addEventListener('click', function () {
      var list = meList.length ? meList : allList;
      stopSpeak(); bMe.classList.add('playing');
      var steps = [];
      list.forEach(function (item, idx) {
        if (item.zh) steps.push({ text: item.zh, lang: 'zh-CN', rate: 1.05, gapAfter: 400, status: '第 ' + (idx + 1) + ' 句：' + item.zh });
        splitIntoChunks(item.en).forEach(function (c) {
          steps.push({ text: c, rate: Math.max(0.48, pref.rate - 0.08), gapAfter: 600, status: '🐢 慢拆示范：' + c });
        });
        steps.push({ text: item.en, rate: pref.rate, gapAfter: pref.shadowGap, status: '🗣️ 留白跟读：' + item.en });
      });
      speakSteps(steps, function () { bMe.classList.remove('playing'); setStatus('✅ 我方必杀句跟读完成！', 'ok'); });
    });

    var bAll = $('btnAllShadow');
    if (bAll) bAll.addEventListener('click', function () {
      stopSpeak(); bAll.classList.add('playing');
      var steps = [];
      allList.forEach(function (item, idx) {
        steps.push({
          text: item.en,
          rate: pref.rate,
          gapAfter: pref.shadowGap,
          status: (item.who === 'me' ? '🙋‍♂️ 我说' : '💬 对方') + ' (' + (idx + 1) + '/' + allList.length + ')：请跟读…'
        });
      });
      speakSteps(steps, function () { bAll.classList.remove('playing'); setStatus('✅ 全程跟读完成', 'ok'); });
    });
  }

  function render(d) {
    d = normalizeResult(d, d && d.mode, d && d.rawInput);
    current = d;
    if (d.mode === 'scene') renderScene(d); else renderTranslate(d);
  }

  /* ================= 8. 历史记录 ================= */
  function loadHist() { return asArr(readJSON(K.hist, [])).filter(function (x) { return x && typeof x === 'object'; }); }
  function pushHist(d) {
    var key = d.mode === 'scene' ? (d.scene || '') : (d.en || '');
    var h = loadHist().filter(function (x) { return x.key !== key; });
    h.unshift({
      key: key,
      label: d.rawInput || d.zh || d.scene || '',
      sub: d.mode === 'scene' ? ((d.dialogues || []).length + ' 句短实战') : (d.en || ''),
      mode: d.mode,
      data: d
    });
    h = h.slice(0, 30);
    writeJSON(K.hist, h);
    renderHist();
  }
  function renderHist() {
    var h = loadHist();
    if (!h.length) { $('histCard').style.display = 'none'; return; }
    $('histCard').style.display = '';
    $('histList').innerHTML = h.map(function (x, i) {
      return '<div class="hist-item" data-i="' + i + '">' +
        '<span class="hi-tag ' + (x.mode === 'scene' ? 'sc' : 'tr') + '">' + (x.mode === 'scene' ? '场景' : '查句') + '</span>' +
        '<div class="hi-zh">' + esc(x.label || '') + '</div>' +
        '<div class="hi-en">' + esc(x.sub || '') + '</div></div>';
    }).join('');
    $('histList').querySelectorAll('.hist-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var x = loadHist()[parseInt(el.dataset.i, 10)];
        if (x && x.data) {
          setMode(x.data.mode || 'translate', true);
          $('inp').value = x.label || '';
          render(x.data);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  }

  /* ================= 9. 模式、分类与语音输入交互 ================= */
  function renderChips() {
    var catObj = PRESETS[pref.cat] || PRESETS.social;
    var list = catObj[mode] || [];
    $('chips').innerHTML = list.map(function (t) {
      return '<div class="chip' + (mode === 'scene' ? ' grp' : '') + '">' + esc(t) + '</div>';
    }).join('');
    $('chips').querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () {
        $('inp').value = c.textContent.trim();
        generate();
      });
    });
  }

  function setMode(m, silent) {
    mode = m === 'translate' ? 'translate' : 'scene';
    pref.mode = mode;
    writeJSON(K.pref, pref);
    $('mTranslate').classList.toggle('active', mode === 'translate');
    $('mScene').classList.toggle('active', mode === 'scene');
    var g = $('btnGen');
    g.classList.toggle('scene', mode === 'scene');
    g.textContent = mode === 'scene' ? '🔥 生成场景短句 + 联想重点词' : '✨ 生成地道英文 + 联想重点词';
    $('inp').placeholder = mode === 'scene'
      ? '描绘你的场景：如「马路上看见漂亮女生想搭讪认识」或「找物流商催延误的货」…'
      : '输入你想说的中文词或句子，马上告诉你怎么说最地道…';
    renderChips();
    if (!silent) { stopSpeak(); $('result').innerHTML = ''; setStatus(''); current = null; }
  }

  // 分类标签点击
  $('catBar').querySelectorAll('.cat-pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      pref.cat = pill.dataset.cat;
      writeJSON(K.pref, pref);
      $('catBar').querySelectorAll('.cat-pill').forEach(function (p) {
        p.classList.toggle('on', p === pill);
      });
      renderChips();
    });
  });

  // 语速四档大按钮 + 男女声切换
  function syncSpeedUI() {
    $('spdGroup').querySelectorAll('.spd-btn').forEach(function (b) {
      b.classList.toggle('on', Math.abs(parseFloat(b.dataset.rate) - pref.rate) < 0.03);
    });
    $('btnVoice').textContent = pref.voiceGender === 'male' ? '👨 男声' : '👩 女声';
  }
  $('spdGroup').querySelectorAll('.spd-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      pref.rate = parseFloat(b.dataset.rate);
      writeJSON(K.pref, pref);
      syncSpeedUI();
      if (current && current.en) speakOne(current.en, pref.rate);
    });
  });
  $('btnVoice').addEventListener('click', function () {
    pref.voiceGender = pref.voiceGender === 'male' ? 'female' : 'male';
    writeJSON(K.pref, pref);
    syncSpeedUI();
    speakOne('Hello, let us practice together.', pref.rate);
  });

  // 语音识别输入（Web Speech API）
  var recognition = null, isRec = false;
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = function (e) {
      var txt = e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript;
      if (txt) {
        $('inp').value = ($('inp').value ? $('inp').value + ' ' : '') + txt;
        setStatus('🎤 已识别：' + txt, 'ok');
      }
    };
    recognition.onend = function () {
      isRec = false;
      $('btnMic').classList.remove('rec');
    };
    recognition.onerror = function () {
      isRec = false;
      $('btnMic').classList.remove('rec');
      setStatus('提示：也可直接点手机输入法键盘右下角的「🎤麦克风」语音输入', '');
    };
  }
  $('btnMic').addEventListener('click', function () {
    if (!recognition) {
      $('inp').focus();
      setStatus('💡 请直接点手机键盘右下角的「🎤麦克风」按钮说话输入', 'ok');
      return;
    }
    if (isRec) { recognition.stop(); return; }
    try {
      isRec = true;
      $('btnMic').classList.add('rec');
      setStatus('🎤 请直接说中文场景或句子…', 'now');
      recognition.start();
    } catch (e) {
      isRec = false;
      $('btnMic').classList.remove('rec');
    }
  });
  $('inp').addEventListener('input', function () {
    try { localStorage.setItem('earspeak_draft_inp', $('inp').value); } catch (e) {}
  });
  $('btnClr').addEventListener('click', function () {
    $('inp').value = '';
    try { localStorage.removeItem('earspeak_draft_inp'); } catch (e) {}
    $('inp').focus();
  });

  /* ================= 10. 主生成流程 ================= */
  function generate() {
    var text = ($('inp').value || '').trim();
    if (!text) {
      setStatus(mode === 'scene' ? '请先输入或点选一个场景' : '请先输入你想说的中文', 'err');
      return;
    }
    if (busy) return;
    stopSpeak();
    busy = true;
    var g = $('btnGen');
    var isScene = mode === 'scene';
    g.disabled = true;
    g.textContent = isScene ? '正在推演短句与关联词…' : '正在拆解地道说法…';
    setStatus(isScene ? '正在生成 5~12 词实战短句与关联重点词…' : '正在翻译地道口语并向外联想重点词…', 'busy');

    callLLM(
      isScene ? SYS_SCENE : SYS_TRANSLATE,
      (isScene ? USR_SCENE : USR_TRANSLATE).replace('%TEXT%', text)
    )
      .then(function (raw) {
        var parsed = parseJSON(raw);
        var d = normalizeResult(parsed, isScene ? 'scene' : 'translate', text);
        if (d.mode === 'scene' && !d.dialogues.length) throw new Error('未返回场景对话，请再点一次');
        if (d.mode !== 'scene' && !d.en) throw new Error('未返回英文句子，请再点一次');
        setStatus(
          d.mode === 'scene' ? '✅ 已生成短句锦囊！点任意句「🔁 死磕这句」开始循环慢跟读' : '✅ 已生成！点「🔁 死磕这句」慢速拆词反复跟读',
          'ok'
        );
        render(d);
        pushHist(d);
      })
      .catch(function (err) {
        var m = (err && err.message) ? err.message : String(err);
        if (/需要登录/.test(m)) {
          setStatus('WorkBuddy 通道需登录；已为你切到 MiniMax 免梯通道，请点右上角 ⚙️ 检查密钥', 'err');
        } else {
          setStatus('出错了：' + m, 'err');
        }
      })
      .then(function () {
        busy = false;
        g.disabled = false;
        g.textContent = mode === 'scene' ? '🔥 生成场景短句 + 联想重点词' : '✨ 生成地道英文 + 联想重点词';
      });
  }

  /* ================= 11. 弹窗与设置事件绑定 ================= */
  $('mTranslate').addEventListener('click', function () { setMode('translate'); });
  $('mScene').addEventListener('click', function () { setMode('scene'); });
  $('btnGen').addEventListener('click', generate);
  $('inp').addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); generate(); }
  });

  $('btnVocab').addEventListener('click', function () { renderVocab(); $('mVocab').classList.add('show'); });
  $('btnSents').addEventListener('click', function () { renderSents(); $('mSents').classList.add('show'); });
  $('btnVocabQuiz').addEventListener('click', function () { vocabQuizMode = !vocabQuizMode; renderVocab(); });
  $('btnSentQuiz').addEventListener('click', function () { sentQuizMode = !sentQuizMode; renderSents(); });
  $('wPopSlow').addEventListener('click', function () {
    if (activeWordItem) speakOne(activeWordItem.p, Math.max(0.45, pref.rate - 0.14));
  });
  $('wPopNorm').addEventListener('click', function () {
    if (activeWordItem) speakOne(activeWordItem.p, 0.92);
  });
  $('wPopSave').addEventListener('click', function () {
    if (!activeWordItem) return;
    var added = toggleVocab(activeWordItem);
    renderWordPopupContent(activeWordItem, false);
    setStatus(added ? '📒 已将「' + activeWordItem.p + '」连同原句收入单词库！' : '已从单词库移出：' + activeWordItem.p, added ? 'ok' : '');
  });

  $('btnCfg').addEventListener('click', function () {
    $('cfgProvider').value = cfg.provider || 'minimax';
    $('cfgMmKey').value = cfg.mmKey || '';
    $('cfgGmKey').value = cfg.gmKey || '';
    $('cfgShadowGap').value = String(pref.shadowGap || 3500);
    $('mCfg').classList.add('show');
  });
  $('btnSaveCfg').addEventListener('click', function () {
    cfg.provider = $('cfgProvider').value;
    cfg.mmKey = $('cfgMmKey').value.trim();
    cfg.gmKey = $('cfgGmKey').value.trim();
    pref.shadowGap = parseInt($('cfgShadowGap').value, 10) || 3500;
    writeJSON(K.cfg, cfg);
    writeJSON(K.pref, pref);
    updateEngineBadge();
    $('mCfg').classList.remove('show');
    setStatus('✅ 配置已保存在手机本地！', 'ok');
  });

  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { $(b.dataset.close).classList.remove('show'); });
  });
  document.querySelectorAll('.modal').forEach(function (m) {
    m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('show'); });
  });

  $('vSpeakAll').addEventListener('click', function () {
    var list = vocabAll();
    if (!list.length) return;
    stopSpeak();
    var steps = [];
    list.forEach(function (x) {
      steps.push({ text: x.p, rate: Math.max(0.5, pref.rate - 0.08), gapAfter: 600, status: '📒 慢读单词：' + x.p + ' (' + (x.zh || '') + ')' });
      if (x.zh) steps.push({ text: x.zh, lang: 'zh-CN', rate: 1.05, gapAfter: 400 });
      steps.push({ text: x.p, rate: pref.rate, gapAfter: 1200 });
    });
    speakSteps(steps, function () { setStatus('✅ 生词本全部带读完毕', 'ok'); });
  });

  $('sSpeakAll').addEventListener('click', function () {
    var list = sentsAll();
    if (!list.length) return;
    stopSpeak();
    var steps = [];
    list.forEach(function (x, idx) {
      if (x.zh) steps.push({ text: x.zh, lang: 'zh-CN', rate: 1.05, gapAfter: 400, status: '⭐ 句子 (' + (idx + 1) + '/' + list.length + ')：' + x.zh });
      steps.push({ text: x.en, rate: pref.rate, gapAfter: pref.shadowGap, status: '🗣️ 请跟读：' + x.en });
    });
    speakSteps(steps, function () { setStatus('✅ 句子本跟读完毕', 'ok'); });
  });

  function exportJSON(kind) {
    var data = kind === 'vocab'
      ? { type: 'earspeak-vocab', at: new Date().toISOString(), items: vocabAll() }
      : { type: 'earspeak-sentences', at: new Date().toISOString(), items: sentsAll() };
    var s = JSON.stringify(data, null, 2);
    try {
      navigator.clipboard.writeText(s).then(function () {
        setStatus('📋 已复制 ' + data.items.length + ' 条到剪贴板！', 'ok');
      }, function () { alert(s); });
    } catch (e) { alert(s); }
  }
  $('vExport').addEventListener('click', function () { exportJSON('vocab'); });
  $('sExport').addEventListener('click', function () { exportJSON('sents'); });

  // 初始化
  updateEngineBadge();
  syncSpeedUI();
  setMode(pref.mode || 'scene', true);
  try {
    var savedInp = localStorage.getItem('earspeak_draft_inp');
    if (savedInp) $('inp').value = savedInp;
  } catch (e) {}
  bumpBadges();
  renderHist();
})();
</script>
</body>
</html>
